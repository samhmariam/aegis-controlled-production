[project]
name = "aegis"
version = "0.1.0"
description = "Controlled enterprise agent reference implementation"
authors = [
    { name = "Samuel H.Mariam", email = "samhmariam@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=2.1.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "SIM", "TID", "RUF", "PL"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN001", "ANN201", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated, no I/O",
    "contract: schema and protocol contracts",
    "integration: crosses a process or file boundary",
    "scenario: end-to-end behavioural run",
]

[tool.coverage.run]
source = ["src/aegis"]
branch = true

[tool.coverage.report]
show_missing = true
